[project]
name = "courier-bot"
version = "0.1.0"
description = "Telegram Support Bot with RAG & Human-in-the-Loop for Couriers"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "aiogram>=3.4.1",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.19.0",
    "alembic>=1.13.1",
    "qdrant-client>=1.8.0",
    "openai>=1.14.1",
    "structlog>=24.1.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
